<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #workspace-frame {
      display: block;
      width: 100%;
      height: 1px;
      border: 0;
      overflow: hidden;
      background: transparent;
    }
    iframe.is-loading {
      position: absolute;
      inset: 0 auto auto 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe
    id="workspace-frame"
    title="팩 운전 신호 작업 영역"
    scrolling="no"
  ></iframe>

  <script>
    let frame = document.getElementById("workspace-frame");
    let currentHtml = null;
    let currentStorageKey = null;
    let resizeObserver = null;
    let mutationObserver = null;
    let scheduledFrame = null;

    function send(type, payload = {}) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type, ...payload },
        "*"
      );
    }

    function disconnectObservers() {
      if (resizeObserver) resizeObserver.disconnect();
      if (mutationObserver) mutationObserver.disconnect();
      resizeObserver = null;
      mutationObserver = null;
    }

    function measureContent() {
      scheduledFrame = null;
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      const content = doc.querySelector(".shell") || doc.body;
      const rect = content.getBoundingClientRect();
      const height = Math.max(1, Math.ceil(rect.height));

      frame.style.height = `${height}px`;
      send("streamlit:setFrameHeight", { height });
    }

    function scheduleMeasure() {
      if (scheduledFrame !== null) return;
      scheduledFrame = window.requestAnimationFrame(measureContent);
    }

    function observeContent() {
      disconnectObservers();

      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      doc.documentElement.style.overflow = "hidden";
      doc.body.style.overflow = "hidden";

      const content = doc.querySelector(".shell") || doc.body;
      resizeObserver = new ResizeObserver(scheduleMeasure);
      resizeObserver.observe(content);

      mutationObserver = new MutationObserver(scheduleMeasure);
      mutationObserver.observe(content, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true,
      });

      if (doc.fonts && doc.fonts.ready) {
        doc.fonts.ready.then(scheduleMeasure).catch(() => {});
      }

      scheduleMeasure();
    }

    function parseDocument(html) {
      const payloadMarkers = ["let payload = ", "const payload = "];
      const payloadMarker = payloadMarkers.find(marker => html.includes(marker));
      if (!payloadMarker) return null;

      const payloadStart = html.indexOf(payloadMarker) + payloadMarker.length;
      const payloadEnd = html.indexOf(";\nconst storageKey = ", payloadStart);
      if (payloadEnd < 0) return null;

      const storageStartMarker = "const storageKey = ";
      const storageStart = html.indexOf(storageStartMarker, payloadEnd) + storageStartMarker.length;
      const storageEnd = html.indexOf(";\nconst metricOrder", storageStart);
      if (storageStart < storageStartMarker.length || storageEnd < 0) return null;

      try {
        return {
          payload: JSON.parse(html.slice(payloadStart, payloadEnd)),
          storageKey: JSON.parse(html.slice(storageStart, storageEnd)),
        };
      } catch (_) {
        return null;
      }
    }

    function activateFrame(nextFrame) {
      const previousFrame = frame;
      disconnectObservers();
      frame = nextFrame;
      frame.classList.remove("is-loading");
      frame.id = "workspace-frame";
      previousFrame.remove();
      observeContent();
    }

    function replaceDocumentWithoutBlank(html) {
      const nextFrame = document.createElement("iframe");
      nextFrame.className = "is-loading";
      nextFrame.title = "팩 운전 신호 작업 영역";
      nextFrame.scrolling = "no";
      nextFrame.style.width = "100%";
      nextFrame.style.height = frame.style.height || "1px";
      nextFrame.style.border = "0";
      nextFrame.style.overflow = "hidden";
      nextFrame.style.background = "transparent";
      frame.insertAdjacentElement("afterend", nextFrame);
      nextFrame.onload = () => activateFrame(nextFrame);
      nextFrame.srcdoc = html;
    }

    function render(args) {
      const html = args && typeof args.html === "string" ? args.html : "";
      const parsed = parseDocument(html);

      if (html === currentHtml && frame.contentDocument) {
        scheduleMeasure();
        return;
      }

      if (
        currentHtml !== null
        && parsed
        && parsed.storageKey === currentStorageKey
        && frame.contentWindow
      ) {
        currentHtml = html;
        frame.contentWindow.postMessage(
          { type: "battery-pack:kpi-update", payload: parsed.payload },
          "*"
        );
        scheduleMeasure();
        return;
      }

      currentHtml = html;
      currentStorageKey = parsed ? parsed.storageKey : null;
      if (frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.childNodes.length) {
        replaceDocumentWithoutBlank(html);
      } else {
        disconnectObservers();
        frame.onload = observeContent;
        frame.srcdoc = html;
      }
    }

    window.addEventListener("message", event => {
      const message = event.data || {};
      if (message.type === "streamlit:render") render(message.args || {});
    });

    send("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
